<div class="container mx-auto p-4 mt-12">
  <div class="card">
    <p-toolbar>
      <div class="p-toolbar-group-start">
        <p-button label="Nuevo Producto" icon="pi pi-plus" styleClass="p-button-success"
          (onClick)="openNew()"></p-button>
      </div>
    </p-toolbar>

    <p-table [value]="products()" [loading]="loading()" [paginator]="true" [rows]="10" [totalRecords]="total()"
      [lazy]="true" (onLazyLoad)="loadProductsLazy($event)">
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Imagen</th>
          <th>Título</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-product>
        <tr>
          <td>{{ product.id }}</td>
          <td>
            <img [src]="product.image" [alt]="product.title" class="w-12 h-12 object-cover rounded"
              (error)="onImageError($event)" />
          </td>
          <td>{{ product.title }}</td>
          <td>{{ product.price | currency }}</td>
          <td>
            <span [class.text-red-500]="product.stock < 10">
              {{ product.stock }}
            </span>
          </td>
          <td>
            <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-info mr-2"
              (onClick)="editProduct(product)"></p-button>
            <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-danger"
              (onClick)="deleteProduct(product)"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog [(visible)]="productDialog" [header]="isEditing() ? 'Editar Producto' : 'Nuevo Producto'" [modal]="true"
    [style]="{ width: '500px' }">
    <form [formGroup]="productForm" (ngSubmit)="saveProduct()">
      <div class="field mb-4">
        <label for="title" class="block mb-2">Título</label>
        <input pInputText id="title" formControlName="title" class="w-full" />
      </div>

      <div class="field mb-4">
        <label for="description" class="block mb-2">Descripción</label>
        <textarea pInputTextarea id="description" formControlName="description" rows="4" class="w-full"></textarea>
      </div>

      <div class="field mb-4">
        <label for="image" class="block mb-2">URL de la imagen</label>
        <input pInputText id="image" formControlName="image" class="w-full" />
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="field">
          <label for="price" class="block mb-2">Precio</label>
          <p-inputNumber inputId="price" formControlName="price" mode="currency" currency="USD" locale="en-US"
            class="w-full"></p-inputNumber>
        </div>

        <div class="field">
          <label for="stock" class="block mb-2">Stock</label>
          <p-inputNumber inputId="stock" formControlName="stock" class="w-full"></p-inputNumber>
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <p-button label="Cancelar" icon="pi pi-times" styleClass="p-button-text" (onClick)="hideDialog()"></p-button>
        <p-button type="submit" label="Guardar" icon="pi pi-check" [disabled]="productForm.invalid"></p-button>
      </div>
    </form>
  </p-dialog>
</div>
