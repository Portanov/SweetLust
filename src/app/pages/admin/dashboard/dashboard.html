<div class="dashboard-shell">
  <section class="panel top-products-panel">
    <div class="panel-header">
      <h2>
        Top productos
        <span>más vendidos este mes</span>
      </h2>
    </div>

    <div class="product-list">
      @for (product of topProducts; track product.rank) {
        <div class="product-row">
          <div class="rank">{{ product.rank }}</div>

          <div class="thumb" [style.background]="product.accent">
            @if (product.image) {
              <img [src]="product.image" [alt]="product.name" />
            } @else {
              <span>{{ product.short }}</span>
            }
          </div>

          <div class="product-meta">
            <div class="name">{{ product.name }}</div>
            <div class="category">
              Ventas · {{ product.sold }}
            </div>
            <div class="product-meter">
              <p-meterGroup
                [value]="[{ label: '', value: product.meterValue, color: product.barColor }]"
                [min]="0"
                [max]="100"
                orientation="horizontal"
                styleClass="product-meter-control"
              ></p-meterGroup>
            </div>
          </div>
        </div>
      }
    </div>
  </section>

  <section class="panel activity-panel">
    <div class="panel-header with-tabs">
      <h2>Actividad diaria</h2>

      <div class="segmented-control" aria-label="Tipo de actividad">
        <button type="button" class="tab active">Reportes</button>
        <button type="button" class="tab">Ventas</button>
      </div>
    </div>

    <p class="section-subtitle">reportes y ventas · agosto 2026</p>

    <article class="chart-card">
      <div class="chart-label">REPORTES POR DÍA</div>
      <div class="chart-container">
        <p-chart type="line" [data]="reportsChartData" [options]="chartOptions"></p-chart>
      </div>
    </article>

    <article class="chart-card">
      <div class="chart-label">VENTAS POR DÍA</div>
      <div class="chart-container">
        <p-chart type="line" [data]="salesChartData" [options]="chartOptions"></p-chart>
      </div>
    </article>
  </section>
</div>
